			shellPath = /bin/sh;
			shellScript = "# Generate WebRTC dSYM using dsymutil\necho \"🛠 Generating dSYM for WebRTC...\"\n\n# Try multiple possible paths for WebRTC framework\nWEBRTC_PATHS=(\n  \"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/WebRTC.framework/WebRTC\"\n  \"${BUILT_PRODUCTS_DIR}/WebRTC.framework/WebRTC\"\n  \"${PODS_ROOT}/WebRTC-SDK/WebRTC.xcframework/ios-arm64/WebRTC.framework/WebRTC\"\n)\n\n# Where Xcode expects the dSYM for this build configuration\nWEBRTC_DSYM=\"${DWARF_DSYM_FOLDER_PATH}/WebRTC.framework.dSYM\"\n\n# Find the WebRTC binary\nWEBRTC_BIN=\"\"\nfor path in \"${WEBRTC_PATHS[@]}\"; do\n  if [ -e \"$path\" ]; then\n    WEBRTC_BIN=\"$path\"\n    echo \"Found WebRTC binary at: $path\"\n    break\n  fi\ndone\n\n# Generate dSYM if binary found and dSYM doesn't exist\nif [ -n \"$WEBRTC_BIN\" ] && [ ! -e \"$WEBRTC_DSYM\" ]; then\n  echo \"🛠 Generating dSYM for WebRTC from: $WEBRTC_BIN\"\n  /usr/bin/dsymutil \"$WEBRTC_BIN\" -o \"$WEBRTC_DSYM\"\n  echo \"✅ WebRTC dSYM generated successfully at: $WEBRTC_DSYM\"\nelif [ -e \"$WEBRTC_DSYM\" ]; then\n  echo \"ℹ️ WebRTC dSYM already exists at: $WEBRTC_DSYM\"\nelse\n  echo \"❌ WebRTC binary not found in any expected location\"\n  echo \"Searched paths:\"\n  for path in \"${WEBRTC_PATHS[@]}\"; do\n    echo \"  - $path\"\n  done\nfi\n";
